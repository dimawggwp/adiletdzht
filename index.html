<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дүниежүзі тарихы — Adilet agai</title>
<style>
  :root{
    --main:#BD6D18;
    --accent:#F07436;
    --bg:#ffffff;
    --soft:#fff7f1;
    --gray:#f4f4f5;
    --text:#1c1917;
    --muted:#78716c;
    --border:#eee5dd;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  body{background:var(--bg);color:var(--text);line-height:1.6;}
  a{text-decoration:none;color:inherit;}

  /* HEADER */
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--main);}
  .logo-badge{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--main),var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;}
  nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  nav button{
    background:none;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;
    font-size:15px;font-weight:600;color:var(--muted);transition:.2s;
  }
  nav button:hover{background:var(--soft);color:var(--main);}
  nav button.active{background:var(--main);color:#fff;}
  .zetix-link{padding:9px 16px;border-radius:10px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);transition:.2s;}
  .zetix-link:hover{background:var(--accent);color:#fff;}
  .admin-btn{padding:9px 14px;border-radius:10px;background:var(--gray);border:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--text);}
  .admin-btn:hover{background:#e7e5e4;}

  /* HERO */
  .hero{text-align:center;padding:70px 24px 50px;background:linear-gradient(180deg,var(--soft),#fff);}
  .hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;color:var(--text);letter-spacing:-1px;}
  .hero h1 span{background:linear-gradient(135deg,var(--main),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{margin-top:14px;color:var(--muted);font-size:18px;}

  /* CONTAINER */
  main{max-width:1100px;margin:0 auto;padding:30px 24px 80px;}
  .section-title{font-size:26px;font-weight:800;margin-bottom:6px;}
  .section-sub{color:var(--muted);margin-bottom:26px;}

  /* PANELS GRID */
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;}
  .panel-card{
    border:1px solid var(--border);border-radius:18px;padding:26px 22px;cursor:pointer;
    background:#fff;transition:.25s;position:relative;overflow:hidden;
  }
  .panel-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(189,109,24,.12);border-color:var(--accent);}
  .panel-card .num{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:1px;}
  .panel-card h3{font-size:20px;margin:8px 0 6px;font-weight:800;}
  .panel-card .cnt{color:var(--muted);font-size:14px;}
  .panel-card .bar{position:absolute;left:0;top:0;height:100%;width:5px;background:linear-gradient(var(--main),var(--accent));}

  /* MATERIALS */
  .back-btn{background:none;border:none;color:var(--main);font-weight:700;cursor:pointer;font-size:15px;margin-bottom:18px;padding:6px 0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
  .mat-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;transition:.2s;}
  .mat-card:hover{box-shadow:0 10px 24px rgba(0,0,0,.08);}
  .mat-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--gray);display:block;}
  .mat-thumb.file{display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--main);background:var(--soft);}
  .mat-body{padding:14px 16px;}
  .mat-body h4{font-size:16px;font-weight:700;margin-bottom:4px;}
  .mat-body p{font-size:13px;color:var(--muted);word-break:break-all;}
  .mat-actions{display:flex;gap:8px;padding:0 16px 14px;}
  .mat-open{flex:1;text-align:center;background:var(--main);color:#fff;padding:8px;border-radius:9px;font-weight:600;font-size:14px;}
  .mat-open:hover{background:var(--accent);}
  .mat-del{background:#fee2e2;color:#dc2626;border:none;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;}

  .empty{text-align:center;padding:50px;color:var(--muted);}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow:auto;}
  .modal h2{font-size:22px;margin-bottom:18px;color:var(--main);}
  .modal label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px;}
  .modal input,.modal select,.modal textarea{
    width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;font-size:15px;background:var(--soft);
  }
  .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--accent);}
  .btn-primary{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--main),var(--accent));color:#fff;border:none;padding:13px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{width:100%;margin-top:8px;background:var(--gray);border:none;padding:11px;border-radius:12px;font-weight:600;cursor:pointer;}
  .err{color:#dc2626;font-size:14px;margin-top:8px;display:none;}

  /* ADMIN BAR */
  .admin-panel{background:var(--soft);border:1px dashed var(--accent);border-radius:16px;padding:18px;margin-bottom:26px;}
  .admin-panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .admin-panel h3{color:var(--main);margin-bottom:12px;}
  .add-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:11px;font-weight:700;cursor:pointer;}
  .badge{display:inline-block;background:var(--main);color:#fff;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;margin-left:8px;vertical-align:middle;}

  /* CUSTOM TABS list in admin */
  .tab-manage{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .tab-chip{background:#fff;border:1px solid var(--border);padding:6px 10px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .tab-chip button{background:none;border:none;color:#dc2626;cursor:pointer;font-weight:700;}

  footer{text-align:center;padding:30px;color:var(--muted);font-size:14px;border-top:1px solid var(--border);}
  @media(max-width:600px){.hero{padding:45px 18px 35px;}nav{width:100%;justify-content:flex-start;overflow-x:auto;}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-badge">A</div>
    <span>Adilet agai</span>
  </div>
  <nav id="nav"></nav>
  <button class="admin-btn" id="adminToggle">🔐 Админ</button>
</header>

<div class="hero">
  <h1>Дүниежүзі <span>тарихы</span></h1>
  <p>Adilet agai-мен бірге тарихты меңгер</p>
</div>

<main id="content"></main>

<footer>© <span id="year"></span> Adilet agai · Дүниежүзі тарихы платформасы</footer>

<!-- LOGIN MODAL -->
<div class="overlay" id="loginModal">
  <div class="modal">
    <h2>Админ панеліне кіру</h2>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="admin@adilet.kz">
    <label>Құпия сөз</label>
    <input type="password" id="loginPass" placeholder="••••••••">
    <div class="err" id="loginErr">Email немесе құпия сөз қате</div>
    <button class="btn-primary" onclick="doLogin()">Кіру</button>
    <button class="btn-ghost" onclick="closeModal('loginModal')">Жабу</button>
  </div>
</div>

<!-- ADD MATERIAL MODAL -->
<div class="overlay" id="matModal">
  <div class="modal">
    <h2>Материал қосу</h2>
    <label>Атауы</label>
    <input type="text" id="matTitle" placeholder="Мысалы: 1-нұсқа талдау">
    <label>Түрі</label>
    <select id="matType">
      <option value="link">🔗 Сілтеме (YouTube / веб)</option>
      <option value="file">📄 Файл сілтемесі (PDF, т.б.)</option>
    </select>
    <label>Сілтеме (URL)</label>
    <input type="text" id="matUrl" placeholder="https://...">
    <div class="err" id="matErr">Барлық өрісті толтырыңыз</div>
    <button class="btn-primary" onclick="saveMaterial()">Қосу</button>
    <button class="btn-ghost" onclick="closeModal('matModal')">Болдырмау</button>
  </div>
</div>

<!-- ADD TAB MODAL -->
<div class="overlay" id="tabModal">
  <div class="modal">
    <h2>Жаңа бөлім қосу</h2>
    <label>Бөлім атауы</label>
    <input type="text" id="tabName" placeholder="Мысалы: Видеосабақтар">
    <label>Ішінде панельдер болсын ба?</label>
    <select id="tabHasPanels">
      <option value="yes">Иә (4 дәуір панелі)</option>
      <option value="no">Жоқ (тікелей материалдар)</option>
    </select>
    <div class="err" id="tabErr">Атауын енгізіңіз</div>
    <button class="btn-primary" onclick="saveTab()">Қосу</button>
    <button class="btn-ghost" onclick="closeModal('tabModal')">Болдырмау</button>
  </div>
</div>

<script>
/* ================= КОНФИГ ================= */
const ADMIN_EMAIL = "admin@adilet.kz";
const ADMIN_PASS  = "adilet123";
const DEFAULT_PANELS = ["Ежелгі заман","Орта ғасырлар","Жаңа заман","Қазіргі заман"];

/* ================ БАСТАПҚЫ ДЕРЕКТЕР ================ */
function defaultData(){
  return {
    tabs:[
      {id:"checklist", name:"Чеклисттер", panels:true, custom:false},
      {id:"analysis",  name:"Нұсқа талдаулар", panels:true, custom:false},
      {id:"books",     name:"Кітаптар", panels:false, custom:false}
    ],
    materials:{} // key: tabId or tabId::panelIndex  -> [ {id,title,type,url} ]
  };
}

let data = JSON.parse(localStorage.getItem("adiletData")) || defaultData();
let isAdmin = sessionStorage.getItem("adiletAdmin")==="1";
let currentTab = data.tabs[0].id;
let currentPanel = null; // index or null
let pendingMatKey = null;

function save(){ localStorage.setItem("adiletData", JSON.stringify(data)); }

/* ================ КӨМЕКШІЛЕР ================ */
function getYouTubeId(url){
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function key(tabId, panel){ return panel===null||panel===undefined ? tabId : tabId+"::"+panel; }

/* ================ НАВИГАЦИЯ ================ */
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  data.tabs.forEach(t=>{
    const b=document.createElement("button");
    b.textContent=t.name;
    b.className = t.id===currentTab ? "active":"";
    b.onclick=()=>{currentTab=t.id;currentPanel=null;render();};
    nav.appendChild(b);
  });
  const z=document.createElement("a");
  z.href="https://Zetix.kz";z.target="_blank";z.className="zetix-link";z.textContent="Zetix";
  nav.appendChild(z);
}

/* ================ БАСТЫ РЕНДЕР ================ */
function render(){
  renderNav();
  document.getElementById("adminToggle").textContent = isAdmin ? "🚪 Шығу" : "🔐 Админ";
  const tab = data.tabs.find(t=>t.id===currentTab);
  const c = document.getElementById("content");
  c.innerHTML="";

  // Админ: бөлім басқару
  if(isAdmin){
    const ap=document.createElement("div");
    ap.className="admin-panel";
    let chips = data.tabs.map(t=>`<span class="tab-chip">${t.name}${t.custom?`<button onclick="deleteTab('${t.id}')">✕</button>`:""}</span>`).join("");
    ap.innerHTML=`<h3>⚙️ Админ басқару</h3>
      <div class="row">
        <button class="add-btn" onclick="openModal('tabModal')">+ Жаңа бөлім</button>
      </div>
      <div class="tab-manage">${chips}</div>`;
    c.appendChild(ap);
  }

  if(!tab) return;

  // Панельдер бар бөлім
  if(tab.panels && currentPanel===null){
    const h=document.createElement("div");
    h.innerHTML=`<div class="section-title">${tab.name}</div><div class="section-sub">Дәуірді таңдаңыз</div>`;
    c.appendChild(h);
    const g=document.createElement("div");g.className="panels";
    DEFAULT_PANELS.forEach((p,i)=>{
      const cnt=(data.materials[key(tab.id,i)]||[]).length;
      const card=document.createElement("div");card.className="panel-card";
      card.innerHTML=`<div class="bar"></div><div class="num">${i+1}-БӨЛІМ</div><h3>${p}</h3><div class="cnt">${cnt} материал</div>`;
      card.onclick=()=>{currentPanel=i;render();};
      g.appendChild(card);
    });
    c.appendChild(g);
  } else {
    // Материалдар тізімі
    const k = key(tab.id, tab.panels?currentPanel:null);
    const title = tab.panels ? DEFAULT_PANELS[currentPanel] : tab.name;

    if(tab.panels){
      const back=document.createElement("button");
      back.className="back-btn";back.textContent="← Артқа";
      back.onclick=()=>{currentPanel=null;render();};
      c.appendChild(back);
    }
    const h=document.createElement("div");
    h.innerHTML=`<div class="section-title">${title}</div><div class="section-sub">Материалдар</div>`;
    c.appendChild(h);

    if(isAdmin){
      const addb=document.createElement("button");
      addb.className="add-btn";addb.style.marginBottom="20px";
      addb.textContent="+ Материал қосу";
      addb.onclick=()=>{pendingMatKey=k;openModal('matModal');};
      c.appendChild(addb);
    }

    const list = data.materials[k]||[];
    if(list.length===0){
      const e=document.createElement("div");e.className="empty";
      e.textContent="Әзірге материал жоқ";
      c.appendChild(e);
    } else {
      const g=document.createElement("div");g.className="grid";
      list.forEach(m=>{
        const card=document.createElement("div");card.className="mat-card";
        let thumb;
        const yt=getYouTubeId(m.url);
        if(m.type==="link" && yt){
          thumb=`<img class="mat-thumb" src="https://img.youtube.com/vi/${yt}/hqdefault.jpg" alt="">`;
        } else if(m.type==="file"){
          thumb=`<div class="mat-thumb file">📄</div>`;
        } else {
          thumb=`<div class="mat-thumb file">🔗</div>`;
        }
        card.innerHTML=`${thumb}
          <div class="mat-body"><h4>${m.title}</h4><p>${m.url}</p></div>
          <div class="mat-actions">
            <a class="mat-open" href="${m.url}" target="_blank">Ашу</a>
            ${isAdmin?`<button class="mat-del" onclick="deleteMaterial('${k}','${m.id}')">Жою</button>`:""}
          </div>`;
        g.appendChild(card);
      });
      c.appendChild(g);
    }
  }
}

/* ================ МОДАЛ ================ */
function openModal(id){document.getElementById(id).classList.add("show");}
function closeModal(id){document.getElementById(id).classList.remove("show");
  document.querySelectorAll(".err").forEach(e=>e.style.display="none");}

/* ================ АДМИН КІРУ ================ */
document.getElementById("adminToggle").onclick=()=>{
  if(isAdmin){ isAdmin=false; sessionStorage.removeItem("adiletAdmin"); currentPanel=null; render(); }
  else openModal('loginModal');
};
function doLogin(){
  const e=document.getElementById("loginEmail").value.trim();
  const p=document.getElementById("loginPass").value;
  if(e===ADMIN_EMAIL && p===ADMIN_PASS){
    isAdmin=true; sessionStorage.setItem("adiletAdmin","1");
    closeModal('loginModal'); render();
  } else { document.getElementById("loginErr").style.display="block"; }
}

/* ================ МАТЕРИАЛ ================ */
function saveMaterial(){
  const t=document.getElementById("matTitle").value.trim();
  const type=document.getElementById("matType").value;
  const url=document.getElementById("matUrl").value.trim();
  if(!t||!url){document.getElementById("matErr").style.display="block";return;}
  if(!data.materials[pendingMatKey]) data.materials[pendingMatKey]=[];
  data.materials[pendingMatKey].push({id:Date.now()+"", title:t, type, url});
  save();
  document.getElementById("matTitle").value="";
  document.getElementById("matUrl").value="";
  closeModal('matModal'); render();
}
function deleteMaterial(k,id){
  if(!confirm("Материалды жоясыз ба?"))return;
  data.materials[k]=data.materials[k].filter(m=>m.id!==id);
  save(); render();
}

/* ================ БӨЛІМ (TAB) ================ */
function saveTab(){
  const n=document.getElementById("tabName").value.trim();
  const panels=document.getElementById("tabHasPanels").value==="yes";
  if(!n){document.getElementById("tabErr").style.display="block";return;}
  const id="tab"+Date.now();
  data.tabs.push({id,name:n,panels,custom:true});
  save();
  document.getElementById("tabName").value="";
  closeModal('tabModal'); render();
}
function deleteTab(id){
  if(!confirm("Бөлімді жоясыз ба?"))return;
  data.tabs=data.tabs.filter(t=>t.id!==id);
  Object.keys(data.materials).forEach(k=>{if(k===id||k.startsWith(id+"::"))delete data.materials[k];});
  if(currentTab===id){currentTab=data.tabs[0]?.id;currentPanel=null;}
  save(); render();
}

/* ================ START ================ */
document.getElementById("year").textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
